name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (from the lockfile)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests (no Docker, no model, no API key)
        run: uv run pytest
      - name: MOCK end-to-end demo
        run: uv run python -m repo_reviewer review ./sample_project --mode mock
      - name: Router comparison harness (MOCK backend)
        run: uv run python scripts/compare_routers.py
